name: voicecop
description: VoiceCop — Police FIR Voice Recording Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Audio recording (modern, mic permission included)
  record: ^5.1.2
  audioplayers: ^6.1.0

  # HTTP / API
  dio: ^5.7.0

  # State management
  provider: ^6.1.2

  # State persistence
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # File / share / export
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  open_filex: ^4.5.0

  # PDF / DOCX export
  pdf: ^3.11.1
  printing: ^5.13.2

  # Permissions
  permission_handler: ^11.3.1

  # UI niceties
  google_fonts: ^6.2.1
  intl: ^0.19.0
  # 0.12+ requires Dart >=3.9.0; cap to 0.11.x for Flutter 3.27.2 / Dart 3.6.1.
  camera: '>=0.11.0 <0.12.0'
  # Capped below 0.15 — 0.15+ requires Dart >=3.8.0; this project runs on
  # Flutter 3.27.2 / Dart 3.6.1. Resolver picks the newest compatible 0.13/0.14.
  google_mlkit_text_recognition: '>=0.13.0 <0.15.0'
  tflite_flutter: ^0.12.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0
  rename: ^3.0.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/police-logo.png"
  remove_alpha_ios: true

# record_linux 0.7.2 (transitively pulled) doesn't implement newer interface
# methods. Force a newer record_linux that does.
dependency_overrides:
  record_linux: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/background_template.png
    - assets/images/police-logo.png

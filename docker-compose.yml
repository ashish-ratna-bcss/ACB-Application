version: '3.8'

services:
  acb-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acb-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "sqlite:///app/acb_documents.db"
      ENVIRONMENT: "production"
      QDRANT_URL: "http://acb-qdrant:6333"
    volumes:
      - acb-data:/app
      - acb-pdf:/app/pdf-files
      - acb-storage:/app/storage
    expose:
      - "8000"
    networks:
      - app_default
    depends_on:
      - acb-qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  acb-qdrant:
    image: qdrant/qdrant:latest
    container_name: acb-qdrant
    restart: unless-stopped
    environment:
      QDRANT_API_KEY: "qdrant-secret-key"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - app_default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  acb-frontend:
    build:
      context: ./acb-demo-application
      dockerfile: Dockerfile
      args:
        # Production mode: nginx proxies /api to backend
        # Frontend calls relative path /api, nginx handles routing
        REACT_APP_BACKEND_URL: "/api"
        PUBLIC_URL: ""
    container_name: acb-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app_default
    depends_on:
      - acb-api

volumes:
  acb-data:
  acb-pdf:
  acb-storage:
  qdrant-storage:

networks:
  app_default:
    name: app_default
    external: true
